# The index tooling's own tests (plan MK1 Task 3), on every change to the
# workflows, scripts or fixtures.
name: self-test

on:
  pull_request:
    paths: ['.github/**', 'scripts/**', 'tests/**']
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/**', 'tests/**']

permissions:
  contents: read

# bash with pipefail, so a failing command before a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  self-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # To sign a fixture keylessly as this workflow, so the signer check is
      # tested with real signatures (no token on fork pull requests: skipped).
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: 11.27.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: loams-listing at the pinned Loams commit
        run: scripts/setup-cli.sh
      - run: tests/self-test.sh
        env:
          SELF_TEST_SIGN: '1'
